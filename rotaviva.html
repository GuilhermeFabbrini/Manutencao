function abrirOcorrencia(v) {
  var h = '<h2>Registrar ocorrência</h2><p class="mudo" style="margin:2px 0 10px">' + (v ? esc(v.placa || 'Sem placa') + ' | ' + esc(v.regiao || '') + ' | ' : '') + 'o horário e o lugar entram sozinhos.</p>' +
    '<div class="tipos-oc">' + TIPOS_OC.map(function (t) { return '<button type="button" data-t="' + esc(t[0]) + '" style="--c:' + t[2] + '">' + ic(t[1]) + '<span>' + esc(t[0]) + '</span></button>'; }).join('') + '</div>' +
    '<label class="campo"><span id="oc-dl">O que aconteceu? <em>(opcional)</em></span><textarea class="inp" id="oc-d" data-semfoco="1" placeholder="Ex.: pneu traseiro furou na rodovia, perto do km 120"></textarea></label>' +
    '<div class="foto-oc oculto" id="oc-prev"><img alt="Foto da ocorrência"><button type="button" class="tirar" id="oc-x" aria-label="Tirar a foto">' + ic('x') + '</button></div>' +
    '<div class="duas" id="oc-bts"><button type="button" class="btn amarelo" id="oc-cam">' + ic('camera') + 'Tirar foto</button><button type="button" class="btn" id="oc-gal">' + ic('galeria') + 'Da galeria</button></div>' +
    '<input type="file" accept="image/*" capture="environment" id="oc-fc" hidden><input type="file" accept="image/*" id="oc-fg" hidden>' +
    '<div class="gps-st" id="oc-g"><span class="roda mini-roda"></span><span>Pegando a localização...</span></div>' +
    '<div class="botoes-folha"><button class="btn verde cheio" id="oc-s">' + ic('ok') + 'Enviar ocorrência</button></div>';
  var f = abrirFolha(h), tipo = '', foto = null, gps = null, pronto = false;
  f.querySelectorAll('.tipos-oc button').forEach(function (b) {
    b.onclick = function () {
      tipo = b.dataset.t;
      f.querySelectorAll('.tipos-oc button').forEach(function (x) { x.classList.toggle('on', x === b); });
      f.querySelector('#oc-dl').innerHTML = tipo === 'Outro' ? 'O que aconteceu? <em>(obrigatório)</em>' : 'O que aconteceu? <em>(opcional)</em>';
    };
  });
  var gpsP = pegarGps(20000).then(function (g) {
    gps = g; pronto = true;
    var el = f.querySelector('#oc-g'); if (!el) return g;
    el.className = 'gps-st ' + (g ? 'ok' : 'sem');
    el.innerHTML = g ? ic('ok') + '<span>Local registrado (±' + g.precisao + ' m)</span>' : ic('pin') + '<span>Sem localização. A ocorrência vai mesmo assim.</span>';
    return g;
  });
  var usar = function (inp) {
    inp.onchange = function () {
      var a = inp.files && inp.files[0]; inp.value = '';
      if (!a) return;
      prepararFoto(a).then(function (p) {
        foto = p;
        var pv = f.querySelector('#oc-prev'); pv.querySelector('img').src = p.previa; pv.classList.remove('oculto');
        f.querySelector('#oc-bts').classList.add('oculto');
      }, function (e) { toast(e.message, true); });
    };
  };
  usar(f.querySelector('#oc-fc')); usar(f.querySelector('#oc-fg'));
  f.querySelector('#oc-cam').onclick = function () { f.querySelector('#oc-fc').click(); };
  f.querySelector('#oc-gal').onclick = function () { f.querySelector('#oc-fg').click(); };
  f.querySelector('#oc-x').onclick = function () { foto = null; f.querySelector('#oc-prev').classList.add('oculto'); f.querySelector('#oc-bts').classList.remove('oculto'); };
  var b = f.querySelector('#oc-s');
  b.onclick = function () {
    var desc = f.querySelector('#oc-d').value.trim();
    if (!tipo) return toast('Toque no que aconteceu (pneu furado, atraso...).', true);
    if (tipo === 'Outro' && !desc) return toast('Escreva em poucas palavras o que aconteceu.', true);
    b.disabled = true; b.innerHTML = '<span class="roda mini-roda"></span>' + (foto ? 'Enviando a foto...' : 'Enviando...');
    Promise.race([gpsP, esperar(pronto ? 0 : 5000)]).then(function () {
      return gravar('registrarOcorrencia', { viagem_id: v ? v.id : '', placa: v ? v.placa : '', tipo: tipo, descricao: desc, gps: gps, foto: foto ? { mime: foto.mime, dados: foto.dados } : null }, 'Ocorrência enviada');
    }).then(function () { fecharFolha(); desenhar(); }, function () { b.disabled = false; b.innerHTML = ic('ok') + 'Enviar ocorrência'; });
  };
}

function cartaoOcorrencia(o, comViagem) {
  var t = tipoOc(o.tipo), aberta = o.status !== 'Resolvida';
  var v = comViagem && o.viagem_id ? viagemDe(o.viagem_id) : null;
  var s = '<div class="oc-card' + (aberta ? ' aberta' : '') + '" style="--c:' + t[2] + '"><div class="oc-top"><span class="oc-ic">' + ic(t[1]) + '</span><div class="oc-tt"><b>' + esc(o.tipo) + '</b>' +
    '<small>' + esc(quando(o.data_hora)) + ' | ' + esc(primeiro(o.registrado_por)) + (o.placa ? ' | ' + esc(o.placa) : '') + '</small></div>' +
    '<span class="pill ' + (aberta ? 'st-Cancelada oc-aberta' : 'st-Finalizada') + '"><i></i>' + (aberta ? 'Aberta' : 'Resolvida') + '</span></div>';
  if (o.descricao) s += '<p class="oc-desc">' + esc(o.descricao) + '</p>';
  if (v) s += '<a class="oc-via" href="#viagem/' + esc(v.id) + '">' + ic('caminhao') + esc(relativo(v.data)) + ' | ' + esc(v.regiao || '') + ' | ' + esc(apelido(v.motorista_id, v.motorista) || 'sem motorista') + ic('dir') + '</a>';
  s += '<div class="linha-btns" style="margin-top:8px">';
  if (o.foto_id) s += '<button class="btn peq" data-foto="' + esc(o.id) + '">' + ic('galeria') + 'Ver foto</button>';
  if (o.latitude !== '' && o.latitude !== undefined) s += '<a class="btn peq" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.latitude + ',' + o.longitude) + '">' + ic('pin') + 'Onde foi</a>';
  if (gestor() && aberta) s += '<button class="btn peq verde" data-resolver="' + esc(o.id) + '">' + ic('ok') + 'Resolvida</button>';
  if (gestor() && !aberta) s += '<button class="btn peq fino" data-reabrir="' + esc(o.id) + '">Reabrir</button>';
  s += '</div>';
  if (!aberta) s += '<p class="fraco oc-res">' + ic('ok') + 'Resolvida por ' + esc(primeiro(o.resolvido_por)) + ' ' + esc(quando(o.resolvido_em)).toLowerCase() + (o.resolucao ? ': ' + esc(o.resolucao) : '') + '</p>';
  return s + '</div>';
}

var FOTOS = {};
function verFoto(id) {
  var f = abrirFolha('<h2>Foto da ocorrência</h2><div class="foto-ver" id="fv"><div class="roda"></div></div><div class="botoes-folha"><button class="btn cheio" onclick="fecharFolha()">Fechar</button></div>');
  var mostrar = function (src) { var el = f.querySelector('#fv'); if (el) el.innerHTML = '<img src="' + src + '" alt="Foto da ocorrência">'; };
  if (FOTOS[id]) return mostrar(FOTOS[id]);
  chamar('foto', { id: id }).then(function (d) { FOTOS[id] = 'data:' + d.mime + ';base64,' + d.dados; mostrar(FOTOS[id]); },
    function (e) { var el = f.querySelector('#fv'); if (el) el.innerHTML = '<p class="fraco">' + esc(e.message || 'Não consegui abrir a foto agora.') + '</p>'; });
}
function resolverOc(id) {
  var f = abrirFolha('<h2>Ocorrência resolvida</h2><label class="campo"><span>Como foi resolvido? <em>(opcional)</em></span><input class="inp" id="rs" placeholder="Ex.: pneu trocado no posto"></label>' +
    '<div class="botoes-folha"><button class="btn verde cheio" id="rs-ok">' + ic('ok') + 'Marcar como resolvida</button></div>');
  f.querySelector('#rs-ok').onclick = function () {
    gravar('resolverOcorrencia', { id: id, resolucao: f.querySelector('#rs').value }, 'Ocorrência resolvida').then(function () { fecharFolha(); desenhar(); }, function () {});
  };
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest && ev.target.closest('[data-foto],[data-resolver],[data-reabrir]');
  if (!b) return;
  ev.preventDefault();
  if (b.dataset.foto) verFoto(b.dataset.foto);
  else if (b.dataset.resolver) resolverOc(b.dataset.resolver);
  else if (b.dataset.reabrir) gravar('resolverOcorrencia', { id: b.dataset.reabrir, resolvida: false }, 'Ocorrência reaberta').then(desenhar, function () {});
});

function ocorrenciasDe(viagemId) { return (DB.ocorrencias || []).filter(function (o) { return o.viagem_id === viagemId; }); }
function ocAbertas() { return (DB.ocorrencias || []).filter(function (o) { return o.status !== 'Resolvida'; }); }

  return s + lista.map(function (o) { return cartaoOcorrencia(o, true); }).join('');

TELAS.ocorrencias.depois = function (r, el) {
  el.querySelectorAll('[data-ver]').forEach(function (b) { b.onclick = function () { PREF.ocVer = b.dataset.ver; salvarPref(); desenhar(); }; });
};

/* ============================================================
 * Resumo do mês: pintinhos entregues, km por caminhão e viagens por motorista
 * Tudo calculado das viagens do aplicativo; vira um cartão pronto para mandar.
 * ============================================================ */
function nomeMes(ym) { var p = ym.split('-'); return MESES[Number(p[1]) - 1] + ' de ' + p[0]; }
function mesesComDados() {
  var h = hojeISO().slice(0, 7), ms = {};
  ms[h] = 1;
  DB.viagens.forEach(function (v) { if (v.data && v.data.slice(0, 7) <= h) ms[v.data.slice(0, 7)] = 1; });
  return Object.keys(ms).sort().reverse().slice(0, 6);
}

function resumoMes(ym) {
  var vs = DB.viagens.filter(function (v) { return String(v.data).slice(0, 7) === ym; });
  var vivasM = vs.filter(function (v) { return v.status !== 'Cancelada'; });
  var fin = vivasM.filter(function (v) { return v.status === 'Finalizada'; });
  var entregue = function (v) { return v.entregas.filter(function (e) { return e.status === 'Entregue'; }); };
  var pintV = function (v) { return entregue(v).reduce(function (a, e) { return a + (Number(e.qtd_pintinhos) || 0); }, 0); };
  var kmV = function (v) { return v.km_rodado !== '' && v.km_rodado !== null && v.km_rodado !== undefined ? Number(v.km_rodado) || 0 : null; };
  var r = {
    ym: ym, pint: 0, entregas: 0, viagens: fin.length, km: 0, comKm: 0,
    canceladas: vs.length - vivasM.length,
    abertas: vivasM.filter(function (v) { return v.status !== 'Finalizada'; }).length,
    porCaminhao: {}, porMotorista: {}, porOrigem: {}, ocorrencias: {}
  };
  vivasM.forEach(function (v) {
    var p = pintV(v);
    r.pint += p; r.entregas += entregue(v).length;
    if (p) r.porOrigem[v.origem || 'Sem origem'] = (r.porOrigem[v.origem || 'Sem origem'] || 0) + p;
  });
  fin.forEach(function (v) {
    var km = kmV(v), p = pintV(v);
    if (km !== null) { r.km += km; r.comKm++; }
    var c = r.porCaminhao[v.placa || 'Sem placa'] = r.porCaminhao[v.placa || 'Sem placa'] || { viagens: 0, km: 0, comKm: 0, pint: 0 };
    c.viagens++; c.pint += p; if (km !== null) { c.km += km; c.comKm++; }
    var nome = (motorista(v.motorista_id) || {}).nome || v.motorista || 'Sem motorista';
    var m = r.porMotorista[nome] = r.porMotorista[nome] || { viagens: 0, km: 0, pint: 0, apelido: apelido(v.motorista_id, v.motorista) || 'Sem motorista' };
    m.viagens++; m.pint += p; if (km !== null) m.km += km;
  });
  (DB.ocorrencias || []).forEach(function (o) { if (String(o.data_hora).slice(0, 7) === ym) r.ocorrencias[o.tipo] = (r.ocorrencias[o.tipo] || 0) + 1; });
  r.nOcorrencias = Object.keys(r.ocorrencias).reduce(function (a, k) { return a + r.ocorrencias[k]; }, 0);
  r.caminhoes = Object.keys(r.porCaminhao).map(function (k) { return Object.assign({ placa: k }, r.porCaminhao[k]); })
    .sort(function (a, b) { return (b.km - a.km) || (b.viagens - a.viagens); });
  r.motoristas = Object.keys(r.porMotorista).map(function (k) { return Object.assign({ nome: k }, r.porMotorista[k]); })
    .sort(function (a, b) { return (b.viagens - a.viagens) || (b.km - a.km); });
  return r;
}

TELAS.resumo = function () {
  var ms = mesesComDados();
  var ym = PREF.resumoMes && ms.indexOf(PREF.resumoMes) >= 0 ? PREF.resumoMes : ms[0];
  var r = resumoMes(ym);
  var s = '<button class="voltar" onclick="history.back()">' + ic('esq') + 'Voltar</button><h2>Resumo do mês</h2>' +
    '<div class="chips" style="margin-top:10px">' + ms.map(function (m) { var p = m.split('-'); return '<button class="chip' + (m === ym ? ' on' : '') + '" data-mes="' + m + '">' + MESES[Number(p[1]) - 1].replace(/^./, function (c) { return c.toUpperCase(); }) + '/' + p[0].slice(2) + '</button>'; }).join('') + '</div>' +
    '<button class="btn verde cheio" id="res-zap" style="margin:4px 0 12px">' + ic('zap') + 'Enviar o resumo no WhatsApp</button>';
  s += '<div class="kpis"><div class="kpi destaque">' + pinto(58) + '<div><small>Pintinhos entregues em ' + esc(nomeMes(ym)) + '</small><b class="num">' + fmt(r.pint) + '</b><span>' + r.entregas + (r.entregas === 1 ? ' entrega' : ' entregas') + '</span></div></div>' +
    '<div class="kpi"><small>Viagens realizadas</small><b class="num">' + r.viagens + '</b><span>' + (r.canceladas ? r.canceladas + (r.canceladas > 1 ? ' canceladas' : ' cancelada') : 'nenhuma cancelada') + '</span></div>' +
    '<div class="kpi"><small>KM rodados</small><b class="num">' + fmt(r.km) + '</b><span>' + (r.comKm < r.viagens ? r.comKm + ' de ' + r.viagens + ' viagens com KM' : (r.comKm ? 'média de ' + fmt(r.km / r.comKm) + ' por viagem' : 'sem KM lançado')) + '</span></div></div>';
  if (r.abertas) s += '<p class="aviso-res">' + ic('alerta') + r.abertas + (r.abertas > 1 ? ' viagens deste mês ainda não foram finalizadas' : ' viagem deste mês ainda não foi finalizada') + ' e só entram no resumo depois do KM final.</p>';
  var tab = function (titulo, sub, linhas) { return '<div class="grafico"><h3>' + titulo + '</h3><p>' + sub + '</p>' + (linhas || '<p class="fraco">Sem viagens finalizadas no mês.</p>') + '</div>'; };
  var mxKm = Math.max.apply(null, r.caminhoes.map(function (c) { return c.km; }).concat([0])), mxV = Math.max.apply(null, r.caminhoes.map(function (c) { return c.viagens; }).concat([1]));
  s += tab(r.comKm ? 'KM por caminhão' : 'Viagens por caminhão', r.comKm ? 'Quilômetros lançados nas viagens finalizadas.' : 'Ainda sem KM lançado neste mês.', r.caminhoes.map(function (c) {
    var pct = mxKm ? c.km / mxKm : c.viagens / mxV;
    return '<div class="res-lin"><div class="res-top">' + placaHtml(c.placa === 'Sem placa' ? '' : c.placa) + '<b class="num">' + (c.comKm ? fmt(c.km) + ' km' : r.comKm ? 'sem KM' : c.viagens + (c.viagens > 1 ? ' viagens' : ' viagem')) + '</b></div>' +
      '<div class="tr"><i style="width:' + Math.max(3, Math.round(pct * 100)) + '%"></i></div><small>' + c.viagens + (c.viagens > 1 ? ' viagens' : ' viagem') + ' | ' + fmt(c.pint) + ' pintinhos' + (c.comKm ? ' | média ' + fmt(c.km / c.comKm) + ' km' : '') + '</small></div>';
  }).join(''));
  var mxM = Math.max.apply(null, r.motoristas.map(function (m) { return m.viagens; }).concat([1]));
  s += tab('Viagens por motorista', 'Viagens finalizadas no mês por cada motorista.', r.motoristas.map(function (m) {
    return '<div class="res-lin"><div class="res-top"><span class="res-nome"><span class="av">' + esc(iniciais(m.nome)) + '</span>' + esc(m.nome) + '</span><b class="num">' + m.viagens + (m.viagens > 1 ? ' viagens' : ' viagem') + '</b></div>' +
      '<div class="tr marinho"><i style="width:' + Math.max(3, Math.round(m.viagens / mxM * 100)) + '%"></i></div><small>' + (m.km ? fmt(m.km) + ' km | ' : '') + fmt(m.pint) + ' pintinhos</small></div>';
  }).join(''));
  var org = Object.keys(r.porOrigem), cores = ['#1665C1', '#FFC83D', '#6E56CF', '#0FA36B'];
  if (org.length) s += '<div class="grafico"><h3>Onde carregou</h3><p>Pintinhos entregues por fornecedor.</p><div class="divisao">' + org.map(function (k, i) { return '<i style="width:' + (r.pint ? r.porOrigem[k] / r.pint * 100 : 0) + '%;background:' + cores[i % 4] + '"></i>'; }).join('') + '</div><div class="legenda">' +
    org.map(function (k, i) { return '<span><i style="background:' + cores[i % 4] + '"></i>' + esc(k) + ' <b>' + Math.round(r.porOrigem[k] / r.pint * 100) + '%</b> (' + fmt(r.porOrigem[k]) + ')</span>'; }).join('') + '</div></div>';
  if (r.nOcorrencias) s += '<div class="grafico"><h3>Ocorrências no mês</h3><p>' + r.nOcorrencias + ' registradas pelos motoristas.</p><div class="legenda">' + Object.keys(r.ocorrencias).map(function (k) { return '<span><i style="background:' + tipoOc(k)[2] + '"></i>' + esc(k) + ' <b>' + r.ocorrencias[k] + '</b></span>'; }).join('') + '</div></div>';
  return s;
};
TELAS.resumo.depois = function (rr, el) {
  el.querySelectorAll('[data-mes]').forEach(function (b) { b.onclick = function () { PREF.resumoMes = b.dataset.mes; salvarPref(); desenhar(); }; });
  el.querySelector('#res-zap').onclick = function () {

    abrirImagemZap('Resumo de ' + nomeMes(ym), 'Cartão com a marca Andrioni, pronto para mandar.', function () { return gerarResumo(ym); }, 'Resumo-' + DB.config.operacao + '-' + ym + '.png');
  };

/** Folha com a prévia da imagem e os botões de mandar e baixar (só a imagem, sem texto). */
function abrirImagemZap(titulo, sub, gerar, nome) {
  var f = abrirFolha('<h2>' + esc(titulo) + '</h2><p class="mudo" style="margin:2px 0 10px">' + esc(sub) + '</p>' +
    '<div id="zi-prev" style="background:#fff;border-radius:18px;min-height:220px;display:grid;place-items:center;overflow:auto;max-height:56vh;box-shadow:var(--sombra)"><div class="roda"></div></div>' +
    '<div class="botoes-folha"><button class="btn verde cheio" id="zi-env" disabled>' + ic('zap') + 'Enviar a imagem</button>' +
    '<button class="btn fino cheio" id="zi-bx" disabled>' + ic('copiar') + 'Baixar a imagem</button></div>');
  var arquivo = null, url = null;
  gerar().then(function (cv) {
    cv.toBlob(function (blob) {
      if (!blob) return;
      arquivo = new File([blob], nome, { type: 'image/png' }); url = URL.createObjectURL(blob);
      var p = f.querySelector('#zi-prev'); if (!p) return;
      p.innerHTML = '<img src="' + url + '" alt="' + esc(titulo) + '" style="width:100%;display:block;border-radius:18px">';
      f.querySelector('#zi-env').disabled = false; f.querySelector('#zi-bx').disabled = false;
    }, 'image/png');
  }).catch(function (e) { console.error(e); var p = f.querySelector('#zi-prev'); if (p) p.innerHTML = '<p class="fraco">Não consegui montar a imagem neste aparelho.</p>'; });
  var baixar = function () { var a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); };
  f.querySelector('#zi-bx').onclick = baixar;
  f.querySelector('#zi-env').onclick = function () {
    if (!arquivo) return;
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) navigator.share({ files: [arquivo] }).catch(function () {});
    else { baixar(); toast('Imagem baixada. No WhatsApp, é só anexar.'); }
  };
  f._fechou = function () { if (url) setTimeout(function () { URL.revokeObjectURL(url); }, 30000); };
}

/* ---------- cartão do resumo ---------- */
function gerarResumo(ym) {
  var r = resumoMes(ym), W = 1080, M = 48;
  var fontes = document.fonts && document.fonts.load ? Promise.all([
    document.fonts.load('800 60px "Bricolage Grotesque"'), document.fonts.load('700 30px "Figtree"'), document.fonts.load('500 26px "Figtree"')
  ]).catch(function () {}) : Promise.resolve();
  return Promise.all([fontes, carregarImg(IMG.logoBranco), (c3ImagemPronta('livre', '') || svgImg(caminhaoSVG({ estado: 'livre', id: 'res', cru: true }), 380, 340)), svgImg(pinto(48), 48, 48), carregarImg(IMG.marcaBranca)]).then(function (a) {
    var logo = a[1], truck = a[2], chick = a[3], marca = a[4];
    var cv = document.createElement('canvas'); cv.width = W; cv.height = 6000;
    var c = cv.getContext('2d');
    c.fillStyle = '#EDF2F9'; c.fillRect(0, 0, W, cv.height);
    // cabeçalho
    var HH = 470, g = c.createLinearGradient(0, 0, W, HH);

    if (r.caminhoes.length) bloco(r.comKm ? 'KM por caminhão' : 'Viagens por caminhão', 'Viagens finalizadas no mês', r.caminhoes, 128, function (x, x0, y0, w) {

      c.fillStyle = '#0A2140'; c.font = '800 38px ' + F_T; var kt = x.comKm ? fmt(x.km) + ' km' : r.comKm ? 'sem KM' : x.viagens + (x.viagens > 1 ? ' viagens' : ' viagem'), kw2 = c.measureText(kt).width; c.fillText(kt, x0 + w - kw2, y0 + 44);

    });
    var mxM = Math.max.apply(null, r.motoristas.map(function (x) { return x.viagens; }).concat([1]));
    if (r.motoristas.length) bloco('Viagens por motorista', 'Viagens finalizadas no mês', r.motoristas, 118, function (x, x0, y0, w) {
      c.beginPath(); c.arc(x0 + 28, y0 + 32, 28, 0, Math.PI * 2); c.fillStyle = '#FFC83D'; c.fill();
      c.fillStyle = '#0A2140'; c.font = '800 24px ' + F_T; var ini = iniciais(x.nome), iw = c.measureText(ini).width; c.fillText(ini, x0 + 28 - iw / 2, y0 + 41);
      c.font = '700 30px ' + F_B; var nmx = x.nome; while (c.measureText(nmx).width > w - 300 && nmx.length > 4) nmx = nmx.slice(0, -2); if (nmx !== x.nome) nmx = nmx.trim() + '…';
      c.fillText(nmx, x0 + 72, y0 + 43);

      c.fillStyle = '#5E6B7D'; c.font = '600 23px ' + F_B; c.fillText((x.km ? fmt(x.km) + ' km   |   ' : '') + fmt(x.pint) + ' pintinhos', x0 + 72, y0 + 106);
    });
    var org = Object.keys(r.porOrigem), cores = ['#1665C1', '#FFC83D', '#6E56CF', '#0FA36B'];

      org.forEach(function (k, i) {

        c.fillStyle = '#0A2140'; c.font = '700 26px ' + F_B; c.fillText(k, x0 + 36, ly);
        c.font = '800 28px ' + F_T; var t = Math.round(r.porOrigem[k] / r.pint * 100) + '%  (' + fmt(r.porOrigem[k]) + ')', tw = c.measureText(t).width; c.fillText(t, x0 + w - tw, ly);
      });
    });
    // rodapé
    caminho(c, M, y, W - 2 * M, 110, 30); c.fillStyle = '#0A2140'; c.fill();
    if (marca) { var mh = 54, mw = mh * marca.width / marca.height; c.drawImage(marca, M + 30, y + 28, mw, mh); }
    c.fillStyle = '#FFFFFF'; c.font = '800 30px ' + F_T; c.fillText('Rota Viva', M + 120, y + 50);
