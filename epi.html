<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>EPI em Dia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: aplicativo de uma tela só no celular — faixa azul de sinalização no topo, conteúdo rolando no meio, abas embaixo. */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D8DEE8;
  --ink: #14213A; --ink-2: #4A5670; --ink-3: #6F7A90;
  --accent: #0B4F9E; --accent-ink: #FFFFFF; --accent-soft: #E3EDF9;
  --head: #0B4F9E; --head-ink: #FFFFFF; --head-ink-2: #C9DCF3;
  --sinal: #F6B700;
  --ok: #1B7F47; --ok-soft: #E1F3E8; --ok-fill: #2E9E5E;
  --warn: #7A5200; --warn-soft: #FFF1C2; --warn-fill: #E9A800;
  --bad: #B3261E; --bad-soft: #FBE4E1; --bad-fill: #D1463C;
  --s1: #2a78d6; --s2: #eb6834;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1522; --surface: #172133; --surface-2: #1D2940; --line: #2C3A54;
    --ink: #EEF2F8; --ink-2: #B7C2D6; --ink-3: #8A97AE;
    --accent: #6AA6EE; --accent-ink: #0B1524; --accent-soft: #1B2F4D;
    --head: #132A4A; --head-ink: #EEF2F8; --head-ink-2: #9FB6D6;
    --sinal: #F6B700;
    --ok: #63CF91; --ok-soft: #153324; --ok-fill: #2E9E5E;
    --warn: #F2C144; --warn-soft: #3A2F0E; --warn-fill: #D99C00;
    --bad: #F28B82; --bad-soft: #3D1B18; --bad-fill: #D1463C;
    --s1: #3987e5; --s2: #d95926;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1522; --surface: #172133; --surface-2: #1D2940; --line: #2C3A54;
  --ink: #EEF2F8; --ink-2: #B7C2D6; --ink-3: #8A97AE;
  --accent: #6AA6EE; --accent-ink: #0B1524; --accent-soft: #1B2F4D;
  --head: #132A4A; --head-ink: #EEF2F8; --head-ink-2: #9FB6D6;
  --sinal: #F6B700;
  --ok: #63CF91; --ok-soft: #153324; --ok-fill: #2E9E5E;
  --warn: #F2C144; --warn-soft: #3A2F0E; --warn-fill: #D99C00;
  --bad: #F28B82; --bad-soft: #3D1B18; --bad-fill: #D1463C;
  --s1: #3987e5; --s2: #d95926;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sinal); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* estrutura */
#app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; background: var(--bg); }
.topo { background: var(--head); color: var(--head-ink); padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--sinal); }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.selo { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2.5px solid currentColor; display: grid; place-items: center; }
.selo svg { width: 18px; height: 18px; }
.marca-txt { min-width: 0; }
.marca-txt b { display: block; font: 700 22px/1 var(--display); letter-spacing: .01em; }
.marca-txt span { display: block; font-size: 13px; color: var(--head-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-btn { background: none; border: 0; color: var(--head-ink); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.topo-btn svg { width: 22px; height: 22px; }
.sinc { background: none; border: 0; color: var(--head-ink-2); font-size: 12px; text-align: right; line-height: 1.2; padding: 6px 0; flex: none; }
.sinc i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5BD08A; margin-right: 5px; }
.sinc.off i { background: var(--sinal); }
.sinc.busca i { animation: pisca 1s infinite; }
@keyframes pisca { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

main > *, .folha-corpo > * { flex-shrink: 0; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 16px; }
.abas { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.aba { flex: 1; min-width: 0; background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--ink-3); position: relative; }
.aba svg { width: 23px; height: 23px; }
.aba.on { color: var(--accent); font-weight: 600; }
.aba.on::before { content: ''; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.aba em { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad-fill); color: #fff; font: 600 11px/18px var(--body); font-style: normal; }
.fab { position: absolute; right: 16px; bottom: 16px; }
.palco { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* tipografia de seção */
.titulo { font: 700 26px/1.1 var(--display); text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 14px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-cab h2 { font: 700 19px/1.15 var(--display); }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* botões e campos */
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 46px; padding: 0 16px; border-radius: var(--r-sm); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.per { color: var(--bad); }
.btn.mini { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.cheio { width: 100%; }
.btn.grande { min-height: 54px; font-size: 17px; border-radius: 27px; padding: 0 22px; box-shadow: 0 6px 18px rgba(11, 79, 158, .35); }
.btn:disabled { opacity: .55; cursor: default; }
.linha-btn { display: flex; gap: 8px; flex-wrap: wrap; }
.linha-btn > .btn { flex: 1; }
.campo { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.campo small { font-weight: 400; color: var(--ink-3); }
input.in, select.in, textarea.in { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-weight: 400; font-size: 16px; }
textarea.in { min-height: 76px; resize: vertical; }
.form { display: flex; flex-direction: column; gap: 14px; }
.dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checks { display: flex; flex-direction: column; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; font-weight: 400; color: var(--ink); font-size: 15px; }
.check input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg button { flex: 1; min-width: 0; border: 0; background: none; min-height: 40px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button b { font-weight: 600; opacity: .8; }

/* blocos */
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.lista { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.item:first-child { border-top: 0; }
.item-txt { flex: 1; min-width: 0; }
.item-txt b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item-txt span { display: block; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.item > svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.vazio { text-align: center; color: var(--ink-2); padding: 26px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); font-size: 15px; }
.vazio b { display: block; color: var(--ink); font: 700 19px/1.2 var(--display); margin-bottom: 4px; }
.pilula { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.pilula svg { width: 13px; height: 13px; }
.pilula.ok { background: var(--ok-soft); color: var(--ok); }
.pilula.warn { background: var(--warn-soft); color: var(--warn); }
.pilula.bad { background: var(--bad-soft); color: var(--bad); }
.pilula.azul { background: var(--accent-soft); color: var(--accent); }
.ponto { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--line); }
.ponto.ok { background: var(--ok-fill); } .ponto.warn { background: var(--warn-fill); } .ponto.bad { background: var(--bad-fill); }

/* indicadores */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font: 700 38px/1 var(--display); }
.kpi span { font-size: 14px; color: var(--ink-2); }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.azul b { color: var(--accent); }
.regua { display: flex; gap: 2px; height: 18px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.regua i { display: block; min-width: 4px; }
.regua .ok { background: var(--ok-fill); } .regua .warn { background: var(--warn-fill); } .regua .bad { background: var(--bad-fill); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.destaque { display: flex; align-items: baseline; gap: 10px; }
.destaque b { font: 700 46px/1 var(--display); }
.destaque span { color: var(--ink-2); font-size: 15px; }

/* vida útil */
.vida { display: flex; flex-direction: column; gap: 5px; }
.vida-trilho { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.vida-trilho i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--ok-fill); }
.vida.warn .vida-trilho i { background: var(--warn-fill); } .vida.bad .vida-trilho i { background: var(--bad-fill); }
.vida-txt { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); }

/* gráficos */
.barras { display: flex; flex-direction: column; gap: 10px; }
.barra-l { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.barra-l span { min-width: 0; overflow-wrap: anywhere; }
.barra-l b { font-weight: 600; }
.barra-t { height: 10px; margin-top: 4px; }
.barra-t i { display: block; height: 100%; min-width: 3px; background: var(--s1); border-radius: 0 4px 4px 0; }
.meses { display: flex; align-items: flex-end; gap: 6px; height: 132px; border-bottom: 1px solid var(--line); position: relative; padding-top: 16px; }
.meses::before { content: attr(data-max); position: absolute; top: 0; left: 0; right: 0; border-top: 1px dashed var(--line); font-size: 11px; color: var(--ink-3); padding-top: 1px; line-height: 1; pointer-events: none; }
.mes { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; background: none; border: 0; padding: 0 2px; border-radius: 6px 6px 0 0; }
.mes.on { background: var(--surface-2); }
.mes i { display: block; width: 42%; max-width: 22px; min-height: 2px; border-radius: 4px 4px 0 0; }
.mes .e { background: var(--s1); } .mes .s { background: var(--s2); }
.meses-r { display: flex; gap: 6px; }
.meses-r span { flex: 1; text-align: center; font-size: 12px; color: var(--ink-3); }
.meses-r span.on { color: var(--ink); font-weight: 600; }
.leitura { font-size: 14px; color: var(--ink-2); }
.leitura b { color: var(--ink); }

/* cartão de pedido */
.ped { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ped-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ped-cab b { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.ped-cab span { display: block; font-size: 13px; color: var(--ink-2); }
.ped-itens { display: flex; flex-direction: column; gap: 6px; }
.ped-item { display: flex; gap: 10px; align-items: baseline; }
.ped-item .q { font: 700 20px/1 var(--display); min-width: 28px; }
.ped-item div { min-width: 0; }
.ped-item small { display: block; color: var(--ink-2); font-size: 13px; }
.nota { font-size: 14px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; }
.nota.bad { background: var(--bad-soft); color: var(--bad); } .nota.warn { background: var(--warn-soft); color: var(--warn); }

/* escolha de EPI no pedido */
.epi-op { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.epi-op:first-child { border-top: 0; }
.epi-op .item-txt b { font-size: 16px; }
.passo { display: flex; align-items: center; gap: 4px; flex: none; }
.passo button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; font-weight: 600; color: var(--accent); }
.passo output { width: 30px; text-align: center; font: 700 22px/1 var(--display); }
.passo output.zero { color: var(--ink-3); }

/* folhas (telas que sobem) */
.folha-fundo { position: fixed; inset: 0; background: rgba(8, 15, 28, .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.folha { background: var(--bg); width: 100%; max-width: 720px; max-height: 94%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.folha.cheia { height: 100%; max-height: 100%; border-radius: 0; }
.folha-cab { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.folha-cab h2 { flex: 1; min-width: 0; font: 700 21px/1.15 var(--display); }
.folha-x { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.folha-x svg { width: 22px; height: 22px; }
.folha-corpo { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
.folha-pe { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.folha-pe .btn { flex: 1; }
#dlg .folha-fundo { z-index: 40; align-items: center; padding: 16px; }
#dlg .folha { border-radius: 16px; max-width: 420px; }

/* assinatura */
.assina { position: relative; background: var(--surface); border: 1.5px dashed var(--ink-3); border-radius: var(--r); height: 180px; touch-action: none; }
.assina canvas { width: 100%; height: 100%; display: block; touch-action: none; border-radius: var(--r); }
.assina::after { content: ''; position: absolute; left: 18px; right: 18px; bottom: 44px; border-bottom: 1px solid var(--ink-3); pointer-events: none; }
.assina span { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 13px; color: var(--ink-3); pointer-events: none; }
.rubrica { width: 96px; height: 40px; flex: none; color: var(--ink); background: var(--surface-2); border-radius: 6px; }
.termo { font-size: 14px; color: var(--ink-2); }
.tam { display: inline-block; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .88em; white-space: nowrap; }
select.tam-sel { width: auto; max-width: 100%; min-height: 40px; padding: 6px 10px; margin-top: 6px; font-size: 15px; }
.item-txt span.tam, .ped-cab span.tam, .ped-item span.tam { display: inline-block; font-size: .88em; color: var(--accent); }
.item-txt span.tams { font-variant-numeric: tabular-nums; margin-top: 2px; }
.item-txt span.tams b { display: inline; color: var(--ink); }

/* entrada */
.entrar { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 24px 20px; max-width: 440px; width: 100%; margin: 0 auto; }
.entrar .selo { width: 56px; height: 56px; color: var(--accent); border-width: 4px; }
.entrar .selo svg { width: 30px; height: 30px; }
.entrar h1 { font: 700 44px/1 var(--display); }
.faixa { height: 8px; background: repeating-linear-gradient(-45deg, var(--sinal) 0 12px, var(--ink) 12px 24px); border-radius: 2px; width: 96px; }
.aviso-demo { background: var(--warn-soft); color: var(--warn); font-size: 14px; padding: 8px 16px; text-align: center; font-weight: 500; }

#toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; justify-content: center; pointer-events: none; }
#toast div { background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-weight: 500; max-width: 480px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
#toast div.bad { background: var(--bad-fill); color: #fff; }
#print { display: none; }

@media print {
  html, body { height: auto; background: #fff; }
  #app, #folha, #dlg, #toast { display: none !important; }
  #print { display: block; color: #000; font: 11pt/1.35 Arial, sans-serif; padding: 0; }
  #print h1 { font: bold 15pt Arial, sans-serif; margin: 0 0 2pt; }
  #print table { width: 100%; border-collapse: collapse; margin-top: 8pt; }
  #print th, #print td { border: 1px solid #000; padding: 3pt 4pt; font-size: 9pt; text-align: left; vertical-align: middle; }
  #print .dados td { border: 0; padding: 1pt 12pt 1pt 0; font-size: 10pt; }
  #print svg { width: 80pt; height: 30pt; color: #000; }
  #print .t { font-size: 9pt; margin-top: 8pt; text-align: justify; }
  #print tr { page-break-inside: avoid; }
  #print .tam { background: none; color: #000; padding: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="folha"></div>
<div id="dlg"></div>
<div id="toast"></div>
<div id="print"></div>

<script>
/* ============================== base ============================== */
var DEMO = !!window.EPI_DEMO;
var TOKEN = null, DB = null, TELA = 'inicio', F = { ped: 'aguardando', periodo: 90, opPainel: '', busca: '', mes: null, cad: 'epis', estoqueBusca: '' };
var SINC = { estado: 'ok', hora: '', n: 0 };
var IX = {};
var MOTIVOS = ['Primeira entrega', 'Troca por fim da vida útil', 'Desgaste ou dano', 'Perda ou extravio', 'Tamanho não serviu', 'Outro'];

var IC = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

function $(s, r) { return (r || document).querySelector(s); }

/** Conversa com a planilha. Dentro do Google usa google.script.run; fora dele, chama o endereço do aplicativo sem levar a conta Google do celular. */
var API_URL = 'https://script.google.com/macros/s/AKfycbzIf_kXqsBXgVmB3w1_QlR7Wwl9XeL_4Uvv4YghKgDh7Yrke4UaY4fNbmx9tX7X_ZE5Vw/exec';
function chamar(acao, dados) {
  return new Promise(function (ok, erro) {
    var chegou = function (txt) {
      var r; try { r = JSON.parse(txt); } catch (e) { return erro(new Error('Resposta inesperada do servidor.')); }
      if (r.ok) return ok(r.dados);
      if (r.erro === 'SESSAO') { sair(true); }
      erro(new Error(r.msg || 'Não deu certo. Tente de novo.'));
    };
    var falhou = function () { var x = new Error('Sem conexão com a planilha. Confira a internet e tente de novo.'); x.rede = true; erro(x); };
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(chegou).withFailureHandler(falhou).api(acao, TOKEN, dados || {});
    } else {
      fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: acao, token: TOKEN, dados: dados || {} }) })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); }).then(chegou, falhou);

}
/** Roda uma ação de botão: trava o botão, mostra o erro e atualiza a tela. */

  return chamar(acao, dados).then(function (r) {
    if (msgOk) toast(msgOk);

}

    SINC.estado = 'ok'; SINC.hora = new Date().toTimeString().slice(0, 5);

  DB.colaboradores.forEach(function (c) { IX.col[c.id] = c; });
  DB.solicitacoes.forEach(function (s) { if (s.status === 'Pendente' || s.status === 'Aprovada') IX.aberto[s.colaborador_id + '|' + s.epi_id] = s.status; });
  var A = { vencidas: [], chegando: [], ca: [], estoque: [], emdia: 0, livre: 0 };
  DB.entregas.forEach(function (e) {

function graficoBarras(titulo, pares, limite) {

function graficoMeses() {

  for (var i = 5; i >= 0; i--) { var d = new Date(Date.UTC(y, m - 1 - i, 1)); ms.push({ k: d.toISOString().slice(0, 7), n: nomes[d.getUTCMonth()], e: 0, s: 0 }); }
  var ix = {}; ms.forEach(function (x) { ix[x.k] = x; });
  (DB.movimentacoes || []).forEach(function (mv) {

    '<div class="sec"><div class="sec-cab"><h2>Assinatura do colaborador</h2><button class="link" data-a="limparAss">Limpar</button></div><div class="assina"><canvas id="en-canvas" aria-label="Área de assinatura"></canvas><span>Assine com o dedo acima da linha</span></div></div>',
    '<button class="btn pri" data-a="confirmarEntrega">' + IC.check + 'Confirmar entrega</button>', true);
  iniciarAssinatura();

function iniciarAssinatura() {
  var cv = $('#en-canvas'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  var cx = cv.getContext('2d'); cx.scale(dpr, dpr); cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.strokeStyle = getComputedStyle(document.body).color;
  ASS = { w: r.width, h: r.height, tracos: [], cx: cx, cv: cv };
  var atual = null;
  var pos = function (e) { var b = cv.getBoundingClientRect(); return [Math.max(0, Math.min(b.width, e.clientX - b.left)), Math.max(0, Math.min(b.height, e.clientY - b.top))]; };
  cv.onpointerdown = function (e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} atual = [pos(e)]; ASS.tracos.push(atual); cx.beginPath(); cx.moveTo(atual[0][0], atual[0][1]); cx.lineTo(atual[0][0] + .1, atual[0][1] + .1); cx.stroke(); };
  cv.onpointermove = function (e) {
    if (!atual) return; e.preventDefault();
    var p = pos(e), u = atual[atual.length - 1];
    if (Math.abs(p[0] - u[0]) + Math.abs(p[1] - u[1]) < 2) return;
    cx.beginPath(); cx.moveTo(u[0], u[1]); cx.lineTo(p[0], p[1]); cx.stroke(); atual.push(p);
  };
  cv.onpointerup = cv.onpointercancel = function () { atual = null; };
}
/** A assinatura vira um desenho leve (traços), que cabe numa célula da planilha. */
function assinaturaTexto() {
  if (!ASS) return '';
  var pontos = ASS.tracos.reduce(function (s, t) { return s + t.length; }, 0);
  if (pontos < 8) return '';
  var W = 320, f = W / ASS.w, H = Math.round(ASS.h * f), passo = 1, txt = '';
  do {
    txt = W + 'x' + H + '|' + ASS.tracos.map(function (t) {
      var pts = t.filter(function (p, i) { return i % passo === 0 || i === t.length - 1; }).map(function (p) { return Math.round(p[0] * f) + ',' + Math.round(p[1] * f); });
      if (pts.length === 1) pts.push(pts[0]);
      return 'M' + pts.join('L');
    }).join(' ');
    passo++;
  } while (txt.length > 40000 && passo < 12);
  return txt;
}
function rubrica(txt, classe) {
  var m = /^(\d{2,4})x(\d{2,4})\|([ML\d ,]+)$/.exec(txt || '');
  if (!m) return '';
  return '<svg class="' + (classe || 'rubrica') + '" viewBox="0 0 ' + m[1] + ' ' + m[2] + '" role="img" aria-label="Assinatura"><path d="' + m[3] + '" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

  mes: function (d) { F.mes = d.k; desenhar(); },
  novoPedido: function (d) { abrirPedido(d.col, d.epi); },
  maisQ: function (d) { PED.q[d.id] = Math.min(20, (PED.q[d.id] || 0) + 1); pintarQ(d.id); },
  menos: function (d) { PED.q[d.id] = Math.max(0, (PED.q[d.id] || 0) - 1); pintarQ(d.id); },
  enviarPedido: function (d, el) {
    var itens = Object.keys(PED.q).filter(function (k) { return PED.q[k] > 0; }).map(function (k) { return { epi_id: k, quantidade: PED.q[k], tamanho: PED.t[k] || '' }; });
    if (!PED.col) return toast('Escolha o colaborador.', true);
    if (!itens.length) return toast('Use o + para escolher pelo menos um EPI.', true);
    var semTam = itens.filter(function (i) { return IX.epi[i.epi_id].tamanhos.length && !i.tamanho; })[0];
    if (semTam) { var st = document.getElementById('t-' + semTam.epi_id); if (st) st.focus(); return toast('Escolha o tamanho de ' + IX.epi[semTam.epi_id].epi + '.', true); }
    if (!$('#pd-motivo').value) return toast('Escolha o motivo do pedido.', true);
    var repetido = itens.filter(function (i) { return IX.aberto[PED.col + '|' + i.epi_id]; });
    var segue = repetido.length ? perguntar('Já existe pedido aberto', 'Este colaborador já tem pedido em andamento de ' + repetido.map(function (i) { return IX.epi[i.epi_id].epi; }).join(', ') + '. Enviar outro mesmo assim?', 'Enviar mesmo assim') : Promise.resolve(true);
    segue.then(function (ok) {
      if (!ok) return;
      executar(el, 'pedir', { colaborador_id: PED.col, itens: itens, motivo: $('#pd-motivo').value, observacao: $('#pd-obs').value }, admin() ? 'Pedido registrado.' : 'Pedido enviado para aprovação.')
        .then(function () { fechar(); F.ped = 'aguardando'; TELA = 'pedidos'; desenhar(); }).catch(function () {});
    });
  },
  aprovar: function (d, el) {
    executar(el, 'decidir', { id: d.id, aprovar: true }).then(function (r) {
      if (!r.faltaEstoque) return toast('Pedido aprovado. Saiu do estoque.');
      perguntar('Estoque não cobre', 'O sistema mostra saldo ' + r.saldo + (r.tamanho ? ' do tamanho ' + r.tamanho : '') + ' e o pedido é de ' + r.qtd + '. Se o EPI existe fisicamente, aprove e depois ajuste a contagem no Estoque.', 'Aprovar mesmo assim').then(function (ok) {
        if (ok) executar(null, 'decidir', { id: d.id, aprovar: true, forcar: true }, 'Pedido aprovado. Saldo ficou negativo: ajuste o estoque.').catch(function () {});
      });
    }).catch(function () {});
  },
  recusar: function (d) {
    perguntar('Recusar pedido', 'O supervisor vai ver o motivo.', 'Recusar', true, 'Motivo da recusa').then(function (m) { if (m) executar(null, 'decidir', { id: d.id, aprovar: false, motivo_recusa: m }, 'Pedido recusado.').catch(function () {}); });
  },
  cancelarPed: function (d) { perguntar('Cancelar este pedido?', '', 'Cancelar pedido', true).then(function (s) { if (s) executar(null, 'cancelar', { id: d.id }, 'Pedido cancelado.').catch(function () {}); }); },
  cancelarAprov: function (d) {
    var itens = IX.aprov.filter(function (s) { return s.colaborador_id === d.col; });
    perguntar('Cancelar ' + plural(itens.length, 'pedido aprovado', 'pedidos aprovados') + '?', 'As unidades voltam para o estoque.', 'Cancelar e devolver ao estoque', true).then(function (s) {
      if (!s) return;
      itens.reduce(function (p, it) { return p.then(function () { return chamar('cancelar', { id: it.id }); }); }, Promise.resolve())
        .then(function () { toast('Cancelado. Estoque devolvido.'); }).catch(function (e) { toast(e.message, true); }).then(function () { sincronizar(true); });
    });
  },
  entregar: function (d) { abrirEntrega(d.col); },
  limparAss: function () { if (ASS) { ASS.tracos = []; ASS.cx.clearRect(0, 0, ASS.w, ASS.h); } },
  confirmarEntrega: function (d, el) {
    var ids = $$('.en-item').filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
    if (!ids.length) return toast('Marque pelo menos um EPI.', true);
    var ass = assinaturaTexto();
    if (!ass) return toast('Falta a assinatura do colaborador.', true);
    executar(el, 'entregar', { ids: ids, assinatura: ass }, 'Entrega registrada na ficha.').then(function () { fechar(); desenhar(); }).catch(function () {});
  },
  ficha: function (d) { abrirFicha(d.id); },
  imprimirFicha: imprimirFicha,
  baixa: function (d) {
    perguntar('Dar baixa neste EPI', 'Use quando o colaborador devolveu, perdeu ou saiu da empresa. O EPI sai da lista de em uso.', 'Dar baixa', true, 'Motivo da baixa').then(function (m) {
      if (m) executar(null, 'baixa', { entrega_id: d.id, motivo: m }, 'Baixa registrada.').then(function () { if (FICHA) abrirFicha(FICHA.colaborador.id); }).catch(function () {});
    });
  },
  editarEpi: function (d) { formEpi(d.id); },
  editarColab: function (d) { formColab(d.id); },
  editarUsuario: function (d) { formUsuario(d.id); },
  editarOp: function (d) { formOp(d.id); },
  entrada: function (d) { formEntrada(d.id); },
  tipoMov: function (d, el) { $$('button', el.parentNode).forEach(function (b) { b.classList.toggle('on', b === el); }); pintarMov(d.f, IX.epi[$('#fm').dataset.epi]); },
  salvarMov: function (d, el) {
    var f = $('#fm'), o = lerForm(f); o.epi_id = f.dataset.epi; o.tipo = f.dataset.tipo;
    if (!f.reportValidity()) return;
    executar(el, 'movimentar', o, o.tipo === 'Entrada' ? 'Entrada lançada.' : 'Estoque ajustado.').then(fechar).catch(function () {});
  },
  salvarForm: function (d, el) {
    var f = $('#fm'), aba = f.dataset.form, o = lerForm(f);
    if (!f.reportValidity()) return;
    executar(el, 'salvar', { aba: aba, registro: o }, 'Salvo.').then(function () { fechar(); if (aba === 'Colaboradores' && FICHA && o.id) FICHA = null; }).catch(function () {});
  }
};
function pintarQ(id) { var o = document.getElementById('q-' + id); if (o) { o.textContent = PED.q[id]; o.classList.toggle('zero', !PED.q[id]); } }

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  var fn = ACT[el.dataset.a]; if (fn) fn(el.dataset, el, ev);
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'pd-col') { PED.col = el.value; PED.q = {}; PED.t = {}; pintarEpisPedido(); }
  if (el.dataset.tam && PED) { PED.t[el.dataset.tam] = el.value; if (el.value && !PED.q[el.dataset.tam]) { PED.q[el.dataset.tam] = 1; pintarQ(el.dataset.tam); } }
  if (el.dataset.m) { F[el.dataset.m] = el.value; desenhar(); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target; if (!el.dataset.busca) return;
  if (el.id === 'busca-col') F.busca = el.value; else F.estoqueBusca = el.value;
  filtrarLista(el);
});
function filtrarLista(el) {
  var q = semAcento(el.value.trim()), n = 0;
  $$(el.dataset.busca + ' [data-txt]').forEach(function (i) { var v = !q || i.dataset.txt.indexOf(q) > -1; i.hidden = !v; if (v) n++; });
  var vazio = $(el.dataset.busca + '-vazia'); if (vazio) vazio.hidden = n > 0;
}
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.dataset.form === 'config') {
    var o = lerForm(f); delete o.ops; o.avisar_novo_pedido = o.avisar_novo_pedido ? 'SIM' : 'NÃO';
    executar(f.querySelector('button[type=submit]'), 'config', o, 'Ajustes salvos.').catch(function () {});
  } else if (f.id === 'login') entrar(f);
});
var desenharOriginal = desenhar;
desenhar = function () { desenharOriginal(); $$('[data-busca]').forEach(function (el) { if (el.value) filtrarLista(el); }); };

/* ============================== entrada e saída ============================== */
function telaLogin(lista, erro) {
  var ultimo = ler('epi_usuario');
  $('#app').dataset.tela = 'login';
  $('#app').innerHTML = (DEMO ? '<div class="aviso-demo">Demonstração com dados de exemplo. Senha de todos: 1234.</div>' : '') +
    '<form class="entrar" id="login"><div class="selo">' + IC.check + '</div><div><h1>EPI em Dia</h1><p class="sub" style="font-size:16px">' + esc(lista ? lista.empresa : '') + '</p></div><div class="faixa" aria-hidden="true"></div>' +
    (erro ? '<div class="nota bad">' + esc(erro) + '</div><button class="btn" type="button" id="lg-de-novo">Tentar de novo</button>' :
      !lista ? '<p class="sub">Carregando…</p>' :
        !lista.usuarios.length ? '<div class="nota warn">Nenhum acesso cadastrado. Na planilha, use o menu EPI &gt; Instalar ou reparar planilha.</div>' :
          '<label class="campo">Quem é você<select class="in" id="lg-quem" required><option value="">Escolha seu nome</option>' + lista.usuarios.map(function (u) { return '<option value="' + esc(u.id) + '"' + (u.id === ultimo ? ' selected' : '') + '>' + esc(u.nome) + (u.perfil === 'admin' ? ' (administrador)' : '') + '</option>'; }).join('') + '</select></label>' +
          '<label class="campo">Senha<input class="in" id="lg-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required placeholder="4 a 6 números"></label>' +
          '<button class="btn pri" type="submit" id="lg-ok" style="min-height:52px;font-size:17px">Entrar</button>') + '</form>';
  var dn = $('#lg-de-novo'); if (dn) dn.onclick = iniciar;
}
function entrar(f) {
  var b = $('#lg-ok'); b.disabled = true; b.textContent = 'Entrando…';
  var id = $('#lg-quem').value;
  chamar('entrar', { id: id, pin: $('#lg-pin').value }).then(function (r) {
    TOKEN = r.token; guardar('epi_token', TOKEN); guardar('epi_usuario', id); SINC.n = 0;
    return sincronizar(true);
  }).catch(function (e) { TOKEN = null; b.disabled = false; b.textContent = 'Entrar'; toast(e.message, true); if ($('#lg-pin')) { $('#lg-pin').value = ''; $('#lg-pin').focus(); } });
}
function sair(expirou) {
  TOKEN = null; DB = null; TELA = 'inicio'; guardar('epi_token', null); window.EPI_TOKEN_INICIAL = null; $('#folha').innerHTML = ''; $('#dlg').innerHTML = '';
  if (expirou) toast('Sua sessão terminou. Entre de novo.', true);
  iniciar();
}
function iniciar() {
  TOKEN = ler('epi_token') || window.EPI_TOKEN_INICIAL || null;
  if (TOKEN) {
    telaLogin(null);
    return sincronizar(true).catch(function (e) { if (TOKEN) telaLogin(null, e.message); });
  }
  telaLogin(null);
  chamar('loginLista').then(function (l) { if (!TOKEN) telaLogin(l); }).catch(function (e) { telaLogin(null, e.message); });
}
iniciar();
</script>
</body>
